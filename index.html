<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sovereign Lair / Invitation of the Return</title>
<script>
  try { if (localStorage.getItem('theme') === 'blacklight') document.documentElement.setAttribute('data-theme','blacklight'); } catch (e) {}
</script>
<style>
  :root {
    --bg:#0b0708; --panel:#140c0d; --ink:#eadfda; --muted:#9a8a89;
    --red:#c0141f; --ember:#e0803a; color-scheme: dark;
  }
  :root[data-theme="blacklight"] {
    --bg:#06000d; --panel:#0e0220; --ink:#e9ffe3; --muted:#9d86c9;
    --red:#d62bff; --ember:#5dff3a;
  }
  :root[data-theme="blacklight"] nav { border-bottom-color:#2b0f4d; }
  :root[data-theme="blacklight"] hr { border-top-color:#2b0f4d; }
  :root[data-theme="blacklight"] h2 { text-shadow:0 0 14px rgba(214,43,255,.55); }
  :root[data-theme="blacklight"] h3 { text-shadow:0 0 10px rgba(93,255,58,.45); }
  .hero .bl { display:none; }
  :root[data-theme="blacklight"] .hero .std { display:none; }
  :root[data-theme="blacklight"] .hero .bl { display:block; }
  .toggle { font:inherit; font-variant:small-caps; letter-spacing:.12em; color:var(--ink);
    background:transparent; border:1px solid var(--red); border-radius:999px;
    padding:.35rem 1rem; cursor:pointer; }
  .toggle:hover { background:var(--red); color:#fff; }
  .toggle:focus-visible { outline:2px solid var(--ember); outline-offset:3px; }
  * { box-sizing:border-box; }
  html,body { margin:0; background:var(--bg); color:var(--ink); }
  body { font-family:Georgia,"Times New Roman",serif; line-height:1.65;
    padding-bottom:env(safe-area-inset-bottom,0px); }
  .hero { width:100%; margin:0; border-bottom:3px solid var(--red); }
  .hero img { display:block; width:100%; height:auto; }
  nav { display:flex; gap:1.25rem; justify-content:center; align-items:center; flex-wrap:wrap;
    position:sticky; top:0; z-index:5;
    padding:1rem; background:var(--panel); border-bottom:1px solid #2a1517;
    font-variant:small-caps; letter-spacing:.12em; }
  a { color:var(--ink); text-decoration-color:var(--red); text-underline-offset:5px; }
  a:focus-visible { outline:2px solid var(--ember); outline-offset:3px; }
  main { max-width:60ch; margin:0 auto; padding:0 1.25rem 4rem; }
  section { padding-top:3.5rem; }
  h2 { font-size:clamp(2rem,7vw,3.25rem); font-weight:400; letter-spacing:.06em;
    margin:0; line-height:1.05; color:var(--red); text-transform:uppercase; }
  .sub { color:var(--muted); font-style:italic; margin:.4rem 0 2rem; }
  h3 { margin:2rem 0 .5rem; font-size:.8rem; letter-spacing:.3em;
    text-transform:uppercase; color:var(--ember); font-weight:400; }
  .stanza { margin:0 0 1rem; font-size:1.1rem; }
  .stanza strong { letter-spacing:.04em; }
  hr { border:0; border-top:1px solid #2a1517; margin:4rem 0 0; }
  footer { text-align:center; color:var(--muted); font-size:.9rem; padding:0 1rem 2rem; }

  section { scroll-margin-top:5rem; }
  .about { text-align:center; }
  .portrait { display:block; width:min(100%,420px); height:auto; margin:1.5rem auto 1rem;
    border:2px solid var(--red); border-radius:4px; }
  .nick { font-size:clamp(2rem,8vw,3.25rem); letter-spacing:.14em; margin:.25rem 0 0;
    text-transform:uppercase; color:var(--ink); }
  .vinc { position:relative; width:min(100%,360px); margin:2rem auto 0; padding-bottom:0; }
  .vinc .v { position:relative; z-index:1; display:block; width:100%; height:auto; mix-blend-mode:screen; }
  .vinc .ring { position:absolute; z-index:2; left:50%; top:46%; width:128%; height:26%;
    transform:translate(-50%,-50%) rotate(-45deg); border-radius:50%;
    border:3px solid var(--red); pointer-events:none;
    box-shadow:0 0 14px var(--red), inset 0 0 14px var(--red); }
  .vinc .rays { display:block; width:130%; margin:-6px 0 0 -15%; height:auto; overflow:visible; }
  .vinc .rays line { stroke:var(--ember); stroke-width:3; stroke-linecap:round; }
  .lsr { display:block; width:160px; height:auto; margin:2rem auto .5rem; mix-blend-mode:screen; }
  .lede { font-size:1.1rem; margin:0 0 1rem; }
  form { display:grid; gap:1rem; margin-top:1.5rem; }
  label { display:grid; gap:.35rem; font-size:.95rem; }
  input[type=text], input[type=email], input[type=tel] { font:inherit; color:var(--ink);
    background:var(--panel); border:1px solid #3a1d20; border-radius:4px; padding:.7rem .8rem; width:100%; }
  input:focus-visible { outline:2px solid var(--ember); outline-offset:2px; }
  .check { display:flex; gap:.6rem; align-items:flex-start; }
  .check input { margin-top:.35rem; accent-color:var(--red); }
  .submit { font:inherit; font-variant:small-caps; letter-spacing:.14em; color:#fff;
    background:var(--red); border:0; border-radius:4px; padding:.85rem 1rem; cursor:pointer; }
  .submit:focus-visible { outline:2px solid var(--ember); outline-offset:3px; }
  .status { min-height:1.5rem; color:var(--ember); }
  .nda { max-height:22rem; overflow:auto; padding:1rem 1.1rem; background:var(--panel);
    border:1px solid #3a1d20; border-radius:4px; font-size:.95rem; }
  .nda h4 { margin:1.1rem 0 .25rem; font-weight:700; }
  .nda h4:first-child { margin-top:0; }
  .nda p { margin:0 0 .5rem; }
  .note { color:var(--muted); font-size:.9rem; }
</style>
</head>
<body>
  <figure class="hero">
    <img class="std" src="data:image/jpeg;base64,...">
  </figure>
  <nav>
    <a href="#about">Sovereign</a>
    <a href="#matrix">Matrix</a>
    <a href="#return">Return</a>
    <button class="toggle" onclick="document.documentElement.toggleAttribute('data-theme', 'blacklight')">Toggle Light</button>
  </nav>
  <main>
    <section id="about" class="about">
      <h2>Sovereign Lair</h2>
      <p class="sub">Invitation of the Return</p>
      <div class="lede">System operational. Architecture nodes synchronized.</div>
    </section>
  </main>
  <footer>
    <p>&copy; 2026 ERIX-BLACK-SPACE / blackcorp.me</p>
  </footer>
</body>
</html>
